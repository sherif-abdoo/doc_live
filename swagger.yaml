openapi: 3.0.3
info:
  title: DOK Live API
  description: |
    Complete REST API documentation for the DOK Live educational platform.
    
    ## Authentication
    Most endpoints require a JWT Bearer token obtained from `POST /login`.
    - **Admin token** — returned when an admin/assistant logs in
    - **Student token** — returned when a student logs in
    
    Pass the token as: `Authorization: Bearer <token>`
  version: 1.0.0
  contact:
    name: DOK Live

servers:
  - url: http://localhost:4000
    description: Local development
  - url: https://dok-edu.com
    description: Production

tags:
  - name: Health
  - name: Auth
  - name: Admin
  - name: DOK (Super Admin)
  - name: Student
  - name: Feed
  - name: Quiz
  - name: Assignment
  - name: Session
  - name: Topic
  - name: Material
  - name: Leaderboard

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    SuccessMessage:
      type: object
      properties:
        status:
          type: string
          example: success
        data:
          type: object
          properties:
            message:
              type: string

    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: Error
        data:
          type: object
          properties:
            message:
              type: string

    Admin:
      type: object
      properties:
        adminId:
          type: integer
        email:
          type: string
          format: email
        name:
          type: string
        group:
          type: string
        phoneNumber:
          type: string
        role:
          type: string
          enum: [assistant, teacher]
        permission:
          type: string
          enum: [all, limited]
        verified:
          type: boolean

    Student:
      type: object
      properties:
        studentId:
          type: integer
        studentEmail:
          type: string
          format: email
        studentName:
          type: string
        group:
          type: string
        semester:
          type: string
        parentEmail:
          type: string
        parentPhoneNumber:
          type: string
        studentPhoneNumber:
          type: string
        birthDate:
          type: string
          format: date-time
        totalScore:
          type: number
        verified:
          type: boolean
        banned:
          type: boolean

    Quiz:
      type: object
      properties:
        quizId:
          type: integer
        title:
          type: string
        description:
          type: string
        mark:
          type: integer
        startDate:
          type: string
          format: date-time
        semester:
          type: string
        durationInMin:
          type: integer
        topicId:
          type: integer
        publisher:
          type: integer

    Assignment:
      type: object
      properties:
        assignId:
          type: integer
        title:
          type: string
        description:
          type: string
        mark:
          type: integer
        document:
          type: string
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        semester:
          type: string
        topicId:
          type: integer
        publisher:
          type: integer

    Submission:
      type: object
      properties:
        subId:
          type: integer
        score:
          type: number
          nullable: true
        answers:
          type: string
        marked:
          type: string
          nullable: true
        subDate:
          type: string
          format: date-time
        studentId:
          type: integer
        assistantId:
          type: integer
        type:
          type: string
          enum: [quiz, assignment]
        semester:
          type: string
        quizId:
          type: integer
          nullable: true
        assId:
          type: integer
          nullable: true
        markedAt:
          type: string
          format: date-time
        feedback:
          type: string
          nullable: true

    Session:
      type: object
      properties:
        sessionId:
          type: integer
        topicId:
          type: integer
        group:
          type: string
        semester:
          type: string
        dateAndTime:
          type: string
          format: date-time
        finished:
          type: boolean
        day:
          type: string

    Topic:
      type: object
      properties:
        topicId:
          type: integer
        topicName:
          type: string
        group:
          type: string
        semester:
          type: string
          enum: [jun, nov]
        publisher:
          type: integer
        subject:
          type: string
          enum: [Biology, Physics, Chemistry]

    Material:
      type: object
      properties:
        materialId:
          type: integer
        title:
          type: string
        description:
          type: string
        document:
          type: string
          nullable: true
        link:
          type: string
          nullable: true
        uploadDate:
          type: string
          format: date-time
        topicId:
          type: integer
        publisher:
          type: integer

    Feed:
      type: object
      properties:
        feedId:
          type: integer
        text:
          type: string
        dateAndTime:
          type: string
          format: date-time
        semester:
          type: string
        adminId:
          type: integer

    Group:
      type: object
      properties:
        groupId:
          type: integer
        groupName:
          type: string

  responses:
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: Error
            data:
              message: Not authorized, no token
    Forbidden:
      description: Authenticated but not permitted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: Validation error or bad input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

paths:

  # ─────────────────────────────────────────
  # HEALTH
  # ─────────────────────────────────────────
  /health:
    get:
      tags: [Health]
      summary: Liveness probe
      responses:
        '200':
          description: Server is up
          content:
            text/plain:
              schema:
                type: string
                example: OK

  # ─────────────────────────────────────────
  # AUTH
  # ─────────────────────────────────────────
  /login:
    post:
      tags: [Auth]
      summary: Log in (admin or student)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  example: secret123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Login successful
                  token:
                    type: string
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      email:
                        type: string
                      group:
                        type: string
                      name:
                        type: string
                      role:
                        type: string
                        example: teacher
        '400':
          description: Wrong password (admin)
          content:
            application/json:
              example:
                status: Error
                data:
                  message: Invalid email or password
        '401':
          description: Wrong password (student)
          content:
            application/json:
              example:
                status: Error
                data:
                  message: Wrong password
        '403':
          description: Account not verified or banned
          content:
            application/json:
              examples:
                notVerified:
                  value:
                    status: Error
                    data:
                      message: Email not verified
                banned:
                  value:
                    status: Error
                    data:
                      message: Your account is banned
        '404':
          description: Email not found
          content:
            application/json:
              example:
                status: Error
                data:
                  message: Email not found

  /login/me:
    get:
      tags: [Auth]
      summary: Get current authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              examples:
                admin:
                  value:
                    status: success
                    data:
                      id: 1
                      group: groupa
                      name: Dr. Ahmed
                      role: teacher
                student:
                  value:
                    status: success
                    data:
                      id: 5
                      group: groupa
                      name: Ali Hassan
                      role: student
                      assistantId: 3
        '401':
          $ref: '#/components/responses/Unauthorized'

  /login/getAllGroups:
    get:
      tags: [Auth]
      summary: Get all available groups (public)
      responses:
        '200':
          description: List of groups
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Group'

  /login/forgetPassword:
    post:
      tags: [Auth]
      summary: Request a password-reset OTP via email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: OTP sent
          content:
            application/json:
              example:
                status: success
                data:
                  email: user@example.com
        '400':
          description: OTP already requested
          content:
            application/json:
              example:
                status: You have already requested an OTP
        '404':
          description: Email not found
          content:
            application/json:
              example:
                status: email not found
        '500':
          description: Email service unavailable
          content:
            application/json:
              example:
                status: Email service unavailable. Try again later.

  /login/otp:
    post:
      tags: [Auth]
      summary: Verify the OTP code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp]
              properties:
                email:
                  type: string
                  format: email
                otp:
                  type: string
                  example: '123456'
      responses:
        '200':
          description: OTP verified
          content:
            application/json:
              example:
                status: success
                code: OTP_VERIFIED
                message: OTP verified successfully
        '400':
          description: Invalid or expired OTP
          content:
            application/json:
              examples:
                invalid:
                  value:
                    status: error
                    code: OTP_INVALID
                    message: This OTP is not valid
                expired:
                  value:
                    status: error
                    code: OTP_EXPIRED
                    message: This OTP has expired

  /login/resetPassword/{email}:
    post:
      tags: [Auth]
      summary: Reset password after OTP verification
      parameters:
        - name: email
          in: path
          required: true
          schema:
            type: string
            format: email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  example: newSecurePassword123
      responses:
        '200':
          description: Password updated
          content:
            application/json:
              examples:
                admin:
                  value:
                    status: success
                    code: ADMIN_PASSWORD_UPDATED
                    message: Admin password updated successfully
                student:
                  value:
                    status: success
                    code: STUDENT_PASSWORD_UPDATED
                    message: Student password updated successfully
        '400':
          description: OTP not verified
          content:
            application/json:
              example:
                status: error
                code: OTP_NOT_VERIFIED
                message: OTP not verified
        '404':
          description: Email not found in any table
          content:
            application/json:
              example:
                status: error
                code: USER_NOT_FOUND
                message: No admin or student found with this email

  # ─────────────────────────────────────────
  # ADMIN
  # ─────────────────────────────────────────
  /admin/adminRegister:
    post:
      tags: [Admin]
      summary: Register a new assistant (public)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name, password, phoneNumber, group]
              properties:
                email:
                  type: string
                  format: email
                name:
                  type: string
                password:
                  type: string
                phoneNumber:
                  type: string
                group:
                  type: string
      responses:
        '201':
          description: Assistant registered
          content:
            application/json:
              example:
                status: success
                data:
                  message: Assistant created successfully
        '400':
          description: Email or phone already exists
          content:
            application/json:
              examples:
                emailExists:
                  value:
                    status: Error
                    data:
                      message: Email already exists
                phoneExists:
                  value:
                    status: Error
                    data:
                      message: Phone number already exists

  /admin/adminSSE:
    get:
      tags: [Admin]
      summary: Open SSE connection for real-time admin notifications
      security:
        - bearerAuth: []
      responses:
        '200':
          description: SSE stream — first event is "connected"
          content:
            text/event-stream:
              schema:
                type: string
                example: "event: connected\ndata: {\"message\":\"SSE connection established\"}\n\n"
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/pendingRegistrations:
    get:
      tags: [Admin]
      summary: List all pending (unverified) student registrations for the admin's group
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Pending students
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    type: object
                    properties:
                      count:
                        type: integer
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                            email:
                              type: string
                            group:
                              type: string
                            phoneNumber:
                              type: string
                            semester:
                              type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/getpendingCount:
    get:
      tags: [Admin]
      summary: Get count of pending registrations for the admin's group
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Pending count
          content:
            application/json:
              example:
                status: success
                message: Pending registration count
                data:
                  count: 5
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/verifyStudent/{studentEmail}:
    patch:
      tags: [Admin]
      summary: Approve a pending student registration
      security:
        - bearerAuth: []
      parameters:
        - name: studentEmail
          in: path
          required: true
          schema:
            type: string
            format: email
      responses:
        '200':
          description: Student verified
          content:
            application/json:
              example:
                status: success
                message: Student Ahmed Samir verified successfully
                data:
                  studentEmail: ahmed@example.com
        '400':
          description: Student already verified
          content:
            application/json:
              example:
                status: Error
                data:
                  message: Student already verified
        '403':
          description: Student in different group
          content:
            application/json:
              example:
                status: Error
                data:
                  message: You are not allowed to access this student
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/rejectStudent/{studentEmail}:
    patch:
      tags: [Admin]
      summary: Reject a pending student. Deletes student when all admins in the group reject.
      security:
        - bearerAuth: []
      parameters:
        - name: studentEmail
          in: path
          required: true
          schema:
            type: string
            format: email
      responses:
        '200':
          description: Student rejected
          content:
            application/json:
              example:
                status: success
                message: Student Ahmed Samir rejected successfully
                data:
                  id: 10
                  studentEmail: ahmed@example.com
        '400':
          description: Already verified or already rejected by this admin
          content:
            application/json:
              examples:
                alreadyVerified:
                  value:
                    status: Error
                    data:
                      message: Student already verified
                alreadyRejected:
                  value:
                    status: Error
                    data:
                      message: Can not reject student twice
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/checkStudentInGroup:
    get:
      tags: [Admin]
      summary: Get all verified students in the admin's group
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Verified students
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                            email:
                              type: string
                            banned:
                              type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/removeStudent/{studentEmail}:
    delete:
      tags: [Admin]
      summary: Permanently delete a student (must be that student's assistant)
      security:
        - bearerAuth: []
      parameters:
        - name: studentEmail
          in: path
          required: true
          schema:
            type: string
            format: email
      responses:
        '200':
          description: Student deleted
          content:
            application/json:
              example:
                status: success
                message: Student Ahmed Samir deleted successfully
                data:
                  id: 10
                  studentEmail: ahmed@example.com
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/banStudent/{studentEmail}:
    patch:
      tags: [Admin]
      summary: Toggle ban/unban for a student
      security:
        - bearerAuth: []
      parameters:
        - name: studentEmail
          in: path
          required: true
          schema:
            type: string
            format: email
      responses:
        '200':
          description: Ban status toggled
          content:
            application/json:
              examples:
                banned:
                  value:
                    status: success
                    message: Student Ahmed Samir banned successfully
                    data:
                      id: 10
                      studentEmail: ahmed@example.com
                unbanned:
                  value:
                    status: success
                    message: Student Ahmed Samir unbanned successfully
                    data:
                      id: 10
                      studentEmail: ahmed@example.com
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/showMyProfile:
    get:
      tags: [Admin]
      summary: Get the admin's own profile and their students list
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Admin profile
          content:
            application/json:
              example:
                status: success
                data:
                  id: 3
                  adminName: Sara Ali
                  adminEmail: sara@example.com
                  phoneNumber: '01099999999'
                  group: groupa
                  students: []
                  admins: n/a
        '404':
          description: Admin not found
          content:
            application/json:
              example:
                status: Error
                data:
                  message: Admin not found
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/showStudentProfile/{studentId}:
    get:
      tags: [Admin]
      summary: Get a specific student's full profile (must be that student's assistant)
      security:
        - bearerAuth: []
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Student profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    $ref: '#/components/schemas/Student'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/showUnmarkedSubmissions:
    get:
      tags: [Admin]
      summary: List all unscored submissions for the admin's group
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Unmarked submissions (or empty message)
          content:
            application/json:
              examples:
                found:
                  value:
                    status: success
                    message: Unmarked submissions for admin Sara Ali
                    data:
                      submissions:
                        - id: 22
                          studentId: 10
                          studentName: Ahmed Samir
                          studentGroup: groupa
                          type: assignment
                          submittedAt: '2026-08-01T10:00:00.000Z'
                          subject: Biology
                          assignmentId: 5
                          assignmentTitle: Cell Division
                empty:
                  value:
                    status: success
                    message: No unmarked submissions found
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/showMarkedSubmissions:
    get:
      tags: [Admin]
      summary: List all scored submissions for the admin's group
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Marked submissions
          content:
            application/json:
              examples:
                found:
                  value:
                    status: success
                    data:
                      submissions:
                        - id: 20
                          studentName: Ahmed Samir
                          type: quiz
                          score: 18
                          markedAt: '2026-07-30T12:00:00.000Z'
                          subject: Physics
                empty:
                  value:
                    status: success
                    message: No marked submissions found
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/showAllSubmissions:
    get:
      tags: [Admin]
      summary: List all submissions (marked and unmarked) for the admin's group
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All submissions
          content:
            application/json:
              example:
                status: success
                data:
                  submissions:
                    - id: 22
                      studentId: 10
                      quizId: null
                      assignmentId: 5
                      submittedAt: null
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/findSubmissionById/{id}:
    get:
      tags: [Admin]
      summary: Get a single submission by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Submission found
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  data:
                    type: object
                    properties:
                      found:
                        $ref: '#/components/schemas/Submission'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/markSubmission/{id}:
    patch:
      tags: [Admin]
      summary: Score a submission and optionally attach a marked PDF. Supports re-marking.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                score:
                  type: number
                  example: 18
                marked:
                  type: string
                  description: URL of the marked PDF
                  example: https://cdn.example.com/marked/submission22.pdf
      responses:
        '200':
          description: Submission marked
          content:
            application/json:
              example:
                status: success
                message: Submission marked successfully
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/createReport/{topicId}:
    get:
      tags: [Admin]
      summary: Generate a full topic performance report (quiz grade, attendance, assignments per student)
      security:
        - bearerAuth: []
      parameters:
        - name: topicId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Topic report
          content:
            application/json:
              example:
                topicId: 4
                topicName: Photosynthesis
                quizTitle: Chapter Quiz
                quizTotalScore: 20
                numberOfAssignments: 2
                totalSession: 4
                students:
                  - id: 10
