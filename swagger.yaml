  /material/deleteMaterial/{id}:
    delete:
      tags: [Material]
      summary: Permanently delete a material
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Material deleted
          content:
            application/json:
              example:
                status: success
                message: Material deleted successfully
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ─────────────────────────────────────────
  # LEADERBOARD
  # ─────────────────────────────────────────
  /leaderBoard:
    get:
      tags: [Leaderboard]
      summary: Paginated leaderboard ordered by total score
      description: |
        Returns 20 students per page sorted by totalScore descending.
        Student token — response includes the student's own rank and score.
        Admin token — response omits the student object.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
          description: Page number (20 students per page)
      responses:
        '200':
          description: Leaderboard data
          content:
            application/json:
              examples:
                studentView:
                  summary: Response for a student token
                  value:
                    status: success
                    data:
                      pagination:
                        currentPage: 1
                        totalPages: 3
                        totalStudents: 55
                      student:
                        score: 85.5
                        rank: 7
                      leaderboard:
                        - studentId: 4
                          studentName: Top Student
                          totalScore: 120
                          group: groupa
                adminView:
                  summary: Response for an admin token
                  value:
                    status: success
                    data:
                      pagination:
                        currentPage: 1
                        totalPages: 3
                        totalStudents: 55
                      leaderboard:
                        - studentId: 4
                          studentName: Top Student
                          totalScore: 120
                          group: groupa
        '401':
          $ref: '#/components/responses/Unauthorized'
